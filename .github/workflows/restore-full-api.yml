name: Restore full API with Supabase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'restore full API') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the complete API and switch only the database adapter
        run: |
          git checkout 9fe3cc1e1940b994130ee7f8d0a4e258d9475943 -- server/api.ts
          sed -i "s#import { db } from './db';#import { db } from './db-supabase';#" server/api.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api.ts
          git commit -m "fix: restore full API with Supabase"
          git push origin HEAD:main
